<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />

    <!--
      Applies the stored theme before first paint. Without this the page
      renders in the OS theme for a frame and then snaps to the saved choice,
      which reads as a flash of the wrong colour scheme on every navigation.
      Kept inline and tiny on purpose: it must run before the stylesheet
      paints, so it cannot be a module import.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('crewmind-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {
          /* private mode, blocked storage — fall through to the OS theme */
        }
      })()
    </script>

    <title>CrewMind | Custom AI Agents &amp; Automation For Your Business</title>
    <meta
      name="description"
      content="We build AI teams that handle your calls, leads, emails, and operations 24/7. No monthly fees. You own everything."
    />

    <link rel="icon" href="/favicon.ico?v=brand-2026" type="image/x-icon" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:image" content="https://crewmind.in/brand/crewmind-og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://crewmind.in/brand/crewmind-og-1200x630.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
